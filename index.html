<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F0E13" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NoteVault — Semester 5 Study Hub</title>
    <meta
      name="description"
      content="Semester 5 study materials — PDFs, notes, question banks and lab manuals, organised by subject and readable in the browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoteVault — Semester 5" />
    <meta
      property="og:description"
      content="Semester 5 study materials — PDFs, notes and presentations, organised by subject and readable in the browser."
    />
    <meta property="og:url" content="https://vardhan23v.github.io/sem5/" />
    <meta property="og:image" content="https://vardhan23v.github.io/sem5/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://vardhan23v.github.io/sem5/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var saved = localStorage.getItem('notevault_theme');
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        NoteVault needs JavaScript to render the library.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Offline shell is a production nicety; skip it during local development.
      if (
        'serviceWorker' in navigator &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1'
      ) {
        window.addEventListener('load', function () {
          // updateViaCache: 'none' keeps a new deployment from being masked by
          // an HTTP-cached service worker file.
          navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
