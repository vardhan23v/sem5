<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoteVault — Semester 5</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <!-- Header -->
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            <line x1="8" y1="7" x2="16" y2="7"></line>
            <line x1="8" y1="11" x2="14" y2="11"></line>
          </svg>
        </div>
        <div class="logo-text">
          <span class="logo-title">NoteVault</span>
          <span class="logo-subtitle">Semester 5</span>
        </div>
      </div>
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="search-container">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input
        type="text"
        class="search-input"
        id="search-input"
        placeholder="Search subjects and files…"
        autocomplete="off"
      >
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat">
        <span class="stat-number" id="stat-subjects">6</span>
        <span class="stat-label">Subjects</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="stat-files">11</span>
        <span class="stat-label">Files</span>
      </div>
    </div>

    <!-- Subject List -->
    <nav class="subject-list" id="subject-list">
      <!-- Rendered by app.js -->
    </nav>

    <!-- Footer -->
    <div class="sidebar-footer">
      <span style="font-size:0.7rem;color:var(--text-muted)">Made with ❤️ for Sem 5</span>
    </div>
  </aside>

  <!-- Mobile Overlay -->
  <div class="mobile-overlay" id="mobile-overlay"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Top Bar -->
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Select a file to view</span>
      <span class="topbar-badge" id="topbar-badge" style="display:none"></span>
    </div>

    <!-- Viewer -->
    <div class="viewer-container" id="viewer-container">
      <!-- Welcome state rendered by app.js -->
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/app.js"></script>

</body>
</html>
